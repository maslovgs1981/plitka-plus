tile2))}.texture.concrete{background-image:radial-gradient(ellipse at 20% 40%,#ffffff70,transparent 65%),repeating-linear-gradient(45deg,#ffffff15 0 1px,transparent 1px 4px),linear-gradient(140deg,var(--tile),var(--tile2))}.texture.stone{background-image:repeating-linear-gradient(172deg,transparent 0 9px,#ffffff38 10px 12px,transparent 13px 24px),linear-gradient(130deg,var(--tile),var(--tile2))}.format-tag{position:absolute;top:10px;left:10px;padding:4px 7px;border-radius:6px;background:#ffffffdd;color:#34463d;font-size:10px;z-index:1}.product-copy{padding:12px 11px 13px;flex:1;width:100%}.product h3{font-size:14px;margin-bottom:4px}.product .description{font-size:10px;color:var(--muted);min-height:30px}.product-price{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:2px}.product-price strong{font-size:16px;white-space:nowrap}.product-price small{font-size:10px;font-weight:400}.arrow{background:var(--soft);width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}.pack-caption{font-size:10px;color:var(--muted);margin-top:3px}.note{text-align:center;font-size:11px;color:var(--muted);padding:22px 8px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:580px;z-index:10;display:flex;gap:8px;border-top:1px solid var(--line);padding:10px 18px calc(10px + var(--safe-bottom));background:var(--panel)}.nav button{flex:1;border-radius:12px;padding:12px 8px;background:transparent;color:var(--muted);font-size:13px;display:flex;justify-content:center;align-items:center;gap:8px}.nav .active{background:var(--soft);color:var(--accent);font-weight:700}.nav svg{width:20px;height:20px}.badge{background:var(--accent);color:var(--onaccent);min-width:21px;height:21px;border-radius:7px;font-size:11px;display:inline-grid;place-items:center;padding:0 4px}.back{background:none;padding:0;min-height:38px;color:var(--muted);margin-bottom:10px;font-size:13px}.detail-image{height:232px;border-radius:18px;margin-bottom:20px}.detail-image .format-tag{top:14px;left:14px}.detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.detail-head .eyebrow{margin-bottom:7px}.pill{border-radius:20px;background:var(--soft);padding:7px 10px;font-size:11px;color:var(--accent);white-space:nowrap}.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:17px 0}.specs div{font-size:13px}.specs small{display:block;margin-bottom:2px}.detail-price{font-size:26px;font-weight:700}.detail-price small{font-size:13px;font-weight:400}.calculator,.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:19px}.calculator h3{margin-bottom:13px}.area-row{display:flex;align-items:end;gap:12px}.area-row .field{flex:1}.reserve{background:var(--soft);border-radius:11px;padding:12px;font-size:12px;white-space:nowrap;margin-bottom:1px}.calc-result{display:flex;justify-content:space-between;gap:8px;margin:15px 0;align-items:center}.calc-result strong{font-size:18px}.calc-result small{display:block;margin-top:2px}.primary{display:block;width:100%;background:var(--accent);color:var(--onaccent);font-weight:650;border-radius:12px;padding:15px 12px;font-size:14px;min-height:48px}.error{color:var(--danger);font-size:12px;margin-top:8px}.cart-heading{display:flex;align-items:center;justify-content:space-between;margin:7px 0 19px}.cart-item{padding:16px 0;border-bottom:1px solid var(--line)}.item-top{display:flex;gap:12px}.thumb{width:77px;height:81px;border-radius:11px;flex-shrink:0}.item-copy{flex:1;min-width:0}.item-copy h3{margin:1px 0 4px;font-size:15px}.item-copy small{display:block;font-size:11px}.item-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}.stepper{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:11px;overflow:hidden}.stepper button{width:42px;height:40px;background:none;font-size:20px}.stepper output{min-width:30px;text-align:center;font-weight:700}.remove{background:none;color:var(--muted);font-size:11px;min-height:36px;padding:0}.totals{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.totals strong{font-size:24px}.totals small{display:block;margin-top:3px}form{display:grid;gap:14px}form h3{margin-bottom:3px}.delivery{border:0;padding:0;margin:0}.delivery legend{font-size:12px;font-weight:600;margin-bottom:8px}.choices{display:flex;gap:8px}.choice{display:flex;gap:7px;align-items:center;flex:1;border:1px solid var(--line);border-radius:11px;padding:12px 8px;font-size:13px;background:var(--panel)}.choice:has(input:checked){border-color:var(--accent);background:var(--soft)}input[type=radio]{accent-color:var(--accent);margin:0}.field textarea{resize:vertical;min-height:80px;font-size:14px}.empty{text-align:center;padding:50px 15px}.empty h2{margin:16px 0 8px}.empty p{color:var(--muted);margin-bottom:22px}.empty-symbol{font-size:45px;color:var(--gold)}.success-mark{width:54px;height:54px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-size:28px;margin-bottom:19px}.summary{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8;margin:15px 0}.json{font:11px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);padding:12px 18px;background:var(--text);color:var(--bg);border-radius:13px;z-index:20;max-width:90%;font-size:13px;box-shadow:0 5px 25px #0002}.hidden{display:none!important}@media(min-width:500px){.texture{height:185px}.detail-image{height:290px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .15s}button:active{transform:scale(.98)}}
</style></head>
<body><div class="app"><header><div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Плитка Плюс</div><span class="demo">Керамогранит</span></header><main id="main"></main></div>
<nav class="nav" aria-label="Основная навигация"><button id="nav-catalog" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Каталог</button><button id="nav-cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>Корзина <span id="cart-count" class="badge">0</span></button></nav><div id="toast" role="status" class="toast hidden"></div>
<script>
'use strict';
// All products are fictional. Integer hundredths of m² avoid package rounding errors.
const products=[
{id:1,name:'Туман Айвори',format:'60×60',surface:'Матовая',color:'Слоновая кость',price:1890,pack:144,a:'#dbd7cd',b:'#bcb6a8',texture:'concrete'},
{id:2,name:'Линия Песка',format:'60×120',surface:'Матовая',color:'Песочный',price:2490,pack:144,a:'#d3c2a8',b:'#b39b7e',texture:'stone'},
{id:3,name:'Облако Перла',format:'120×120',surface:'Полированная',color:'Жемчужный',price:4290,pack:288,a:'#e5e4de',b:'#b9bdba',texture:''},
{id:4,name:'Тихий Графит',format:'60×60',surface:'Структурная',color:'Графитовый',price:2190,pack:144,a:'#737974',b:'#424b47',texture:'stone'},
{id:5,name:'Дюна Крем',format:'60×120',surface:'Лаппатированная',color:'Кремовый',price:2890,pack:144,a:'#e1d0b4',b:'#bbab94',texture:''},
{id:6,name:'Роща Мёд',format:'20×120',surface:'Структурная',color:'Медовый дуб',price:2690,pack:120,a:'#ba9262',b:'#dbc2a0',texture:'wood'},
{id:7,name:'Скала Сильвер',format:'120×120',surface:'Матовая',color:'Светло-серый',price:3690,pack:288,a:'#bebfba',b:'#8e9690',texture:'concrete'},
{id:8,name:'Ночь Оникс',format:'60×120',surface:'Полированная',color:'Угольный',price:3390,pack:144,a:'#484a45',b:'#242e29',texture:''},
{id:9,name:'Берег Терра',format:'60×60',surface:'Матовая',color:'Терракотовый',price:1990,pack:144,a:'#b7826b',b:'#d0a38b',texture:'concrete'},
{id:10,name:'Роща Дым',format:'20×120',surface:'Матовая',color:'Серо-коричневый',price:2590,pack:120,a:'#a59b8c',b:'#776b59',texture:'wood'},
{id:11,name:'Шёлк Олива',format:'60×120',surface:'Лаппатированная',color:'Серо-оливковый',price:3090,pack:144,a:'#9da28c',b:'#c1c4b1',texture:'stone'},
{id:12,name:'Лёд Кварц',format:'120×120',surface:'Полированная',color:'Холодный белый',price:4590,pack:288,a:'#e1e5e4',b:'#bdc9c7',texture:''}
];
const cart=new Map(), filters={format:'',surface:'',max:4600}, draft={name:'',phone:'',delivery:'pickup',comment:''};
let view='catalog', selected=null, area='12', tg=null, mx=null, insideMax=false, insideTelegram=false, submitted=false, toastTimer;
const $=s=>document.querySelector(s), number=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n), money=n=>number(n)+' ₽';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const product=id=>products.find(p=>p.id===id), packPrice=p=>p.price*p.pack; // kopecks
const total=()=>[...cart].reduce((s,[id,q])=>s+packPrice(product(id))*q,0);
const count=()=>[...cart.values()].reduce((s,q)=>s+q,0);
function texture(p,cls=''){return `<div class="texture ${p.texture} ${cls}" style="--tile:${p.a};--tile2:${p.b}" role="img" aria-label="Образец: ${p.color}"><span class="format-tag">${p.format} см</span></div>`;}
function updateNav(){ $('#cart-count').textContent=count();$('#nav-catalog').classList.toggle('active',view==='catalog'||view==='detail');$('#nav-cart').classList.toggle('active',view==='cart'||view==='result');syncMainButton();}
function syncMainButton(){if(!insideTelegram||!tg.MainButton)return;if(view==='cart'&&cart.size&&!submitted){tg.MainButton.setText('Оформить · '+money(total()/100));tg.MainButton.enable();tg.MainButton.show();}else tg.MainButton.hide();}
function go(next){view=next;render();window.scrollTo(0,0);}
function render(){if(view==='catalog')renderCatalog();if(view==='detail')renderDetail();if(view==='cart')renderCart();updateNav();}
function renderCatalog(){ $('#main').innerHTML=`<section class="hero"><div class="eyebrow">Фактура вашего дома</div><h1>Керамогранит</h1><p>Тёплый камень. Чистые линии.<br>Найдите свою поверхность.</p><div class="stack" aria-hidden="true"><i></i><i></i><i></i></div></section><div class="section-line"><h2>Коллекция</h2><small>12 оттенков и фактур</small></div><div class="filters"><label class="field">Формат<select id="format"><option value="">Все форматы</option>${['60×60','60×120','120×120','20×120'].map(x=>`<option ${filters.format===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Поверхность<select id="surface"><option value="">Все поверхности</option>${['Матовая','Полированная','Лаппатированная','Структурная'].map(x=>`<option ${filters.surface===x?'selected':''}>${x}</option>`).join('')}</select></label><div class="price-filter"><label class="price-label" for="max-price"><span>Цена за м²</span><strong id="price-label">до ${money(filters.max)}</strong></label><input type="range" id="max-price" min="1800" max="4600" step="10" value="${filters.max}"></div></div><div class="result-line"><span id="found" class="muted"></span><button class="text-button" id="reset">Сбросить фильтры ↺</button></div><div class="grid" id="products"></div><p class="note">Цены указаны за м², наличие уточняйте у менеджера<br>Продажа целыми упаковками</p>`;
$('#format').onchange=e=>{filters.format=e.target.value;drawProducts();};$('#surface').onchange=e=>{filters.surface=e.target.value;drawProducts();};$('#max-price').oninput=e=>{filters.max=+e.target.value;$('#price-label').textContent='до '+money(filters.max);drawProducts();};$('#reset').onclick=()=>{Object.assign(filters,{format:'',surface:'',max:4600});renderCatalog();};drawProducts();}
function drawProducts(){const list=products.filter(p=>(!filters.format||p.format===filters.format)&&(!filters.surface||p.surface===filters.surface)&&p.price<=filters.max);$('#found').textContent='Найдено: '+list.length;$('#products').innerHTML=list.length?list.map(p=>`<button class="product" data-id="${p.id}" aria-label="Открыть ${p.name}">${texture(p)}<div class="product-copy"><h3>${p.name}</h3><div class="description">${p.surface} · ${p.color}</div><div class="product-price"><strong>${number(p.price)} <small>₽/м²</small></strong><span class="arrow" aria-hidden="true">↗</span></div><div class="pack-caption">${number(p.pack/100)} м² в упаковке</div></div></button>`).join(''):'<p class="muted" style="grid-column:1/-1;padding:24px 0">Нет подходящей плитки. Измените фильтры.</p>';$('#products').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=product(+b.dataset.id);area='12';go('detail');});}
function calculate(){const raw=String(area).trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(raw))return null;const value=Number(raw);if(value<=0||value>10000)return null;const packs=Math.ceil(Math.round(value*100)*110/(selected.pack*100));return {packs,coverage:packs*selected.pack/100,sum:packs*packPrice(selected)/100};}
function renderDetail(){const p=selected;$('#main').innerHTML=`<button class="back" id="back">← В каталог</button>${texture(p,'detail-image')}<div class="detail-head"><div><div class="eyebrow">Коллекция · ${String(p.id).padStart(2,'0')}</div><h2>${p.name}</h2></div><span class="pill">Керамогранит</span></div><div class="specs"><div><small>Формат</small>${p.format} см</div><div><small>Поверхность</small>${p.surface}</div><div><small>Цвет</small>${p.color}</div><div><small>Упаковка</small>${number(p.pack/100)} м²</div></div><div class="detail-price">${money(p.price)} <small>за м²</small></div><small>${money(packPrice(p)/100)} за упаковку</small><section class="calculator"><h3>Сколько плитки нужно?</h3><div class="area-row"><label class="field">Площадь, м²<input id="area" inputmode="decimal" type="text" value="${area}" maxlength="9" aria-describedby="area-error"></label><span class="reserve">+ 10% запас</span></div><p id="area-error" class="error hidden">Укажите площадь от 0,01 до 10 000 м², до двух знаков после запятой.</p><div id="calc-result" class="calc-result" aria-live="polite"></div><button id="add" class="primary">В корзину</button><p class="note" style="padding-top:10px">С запасом на подрезку. Округляем до упаковки.</p></section>`;$('#back').onclick=()=>go('catalog');$('#area').oninput=e=>{area=e.target.value;updateCalc();};$('#add').onclick=()=>{const c=calculate();if(!c)return;const next=(cart.get(p.id)||0)+c.packs;if(next>100000){toast('Достигнут предел количества');return;}cart.set(p.id,next);submitted=false;updateNav();toast('Добавлено: '+c.packs+' уп. · '+number(c.coverage)+' м²');};updateCalc();}
function updateCalc(){const c=calculate();$('#area-error').classList.toggle('hidden',!!c);$('#add').disabled=!c;$('#calc-result').innerHTML=c?`<div><strong>${c.packs} уп.</strong><small>${number(c.coverage)} м² плитки</small></div><strong>${money(c.sum)}</strong>`:'<span class="muted">Проверьте площадь</span>';$('#add').textContent=c?'В корзину · '+money(c.sum):'В корзину';}
function renderCart(){if(!cart.size){$('#main').innerHTML='<div class="empty"><div class="empty-symbol">◇</div><h2>Здесь будет ваша плитка</h2><p>Выберите фактуру и рассчитайте<br>количество для своего пространства.</p><button class="primary" id="browse">Перейти в каталог</button></div>';$('#browse').onclick=()=>go('catalog');return;}
$('#main').innerHTML=`<div class="cart-heading"><h1>Корзина</h1><small>${count()} уп.</small></div><div id="cart-items">${[...cart].map(([id,q])=>{const p=product(id);return `<article class="cart-item"><div class="item-top">${texture(p,'thumb')}<div class="item-copy"><h3>${p.name}</h3><small>${p.format} см · ${p.surface}</small><small>${q} уп. × ${number(p.pack/100)} м² = ${number(q*p.pack/100)} м²</small><strong>${money(q*packPrice(p)/100)}</strong></div></div><div class="item-actions"><div class="stepper"><button data-id="${id}" data-step="-1" aria-label="Уменьшить ${p.name}" ${q===1?'disabled':''}>−</button><output aria-label="Количество упаковок">${q}</output><button data-id="${id}" data-step="1" aria-label="Увеличить ${p.name}">+</button></div><button class="remove" data-remove="${id}" aria-label="Удалить ${p.name}">Удалить</button></div></article>`;}).join('')}</div><div class="totals"><div><b>Итого за плитку</b><small>${number([...cart].reduce((s,[id,q])=>s+product(id).pack*q,0)/100)} м² · ${count()} уп.</small></div><strong>${money(total()/100)}</strong></div><form id="checkout"><h3>Оформление</h3><label class="field">Имя<input name="name" id="name" autocomplete="off" maxlength="60" required placeholder="Как к вам обращаться" value="${escapeHTML(draft.name)}"></label><label class="field">Телефон<input name="phone" id="phone" type="tel" inputmode="tel" autocomplete="off" maxlength="25" required placeholder="Номер для связи" value="${escapeHTML(draft.phone)}"></label><fieldset class="delivery"><legend>Способ получения</legend><div class="choices"><label class="choice"><input type="radio" name="delivery" value="pickup" ${draft.delivery==='pickup'?'checked':''}>Самовывоз</label><label class="choice"><input type="radio" name="delivery" value="delivery" ${draft.delivery==='delivery'?'checked':''}>Доставка</label></div></fieldset><small id="delivery-note">${draft.delivery==='delivery'?'Стоимость доставки не включена. Детали требуют согласования.':'Самовывоз: детали получения требуют согласования.'}</small><label class="field">Комментарий <span class="muted">Необязательно</span><textarea name="comment" maxlength="250" placeholder="Пожелания к заказу">${escapeHTML(draft.comment)}</textarea></label><button class="primary" type="submit" id="submit">Оформить · ${money(total()/100)}</button><p class="error hidden" id="order-error" role="alert"></p><small style="text-align:center">Оплата после подтверждения заказа менеджером.</small></form>`;
$('#cart-items').querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const id=+b.dataset.id,q=cart.get(id)+(+b.dataset.step);if(q>=1&&q<=100000){cart.set(id,q);renderCart();updateNav();}});$('#cart-items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.delete(+b.dataset.remove);renderCart();updateNav();});$('#checkout').oninput=e=>{if(e.target.name)draft[e.target.name]=e.target.value;e.target.setCustomValidity?.('');if(e.target.name==='delivery')$('#delivery-note').textContent=draft.delivery==='delivery'?'Стоимость доставки не включена. Детали требуют согласования.':'Самовывоз: детали получения требуют согласования.';};$('#checkout').onsubmit=e=>{e.preventDefault();submitOrder();};if(insideMax){$('#checkout').noValidate=true;for(const id of ['name','phone']){$('#'+id).required=false;$('#'+id).closest('label').classList.add('hidden');}$('#checkout').querySelector('textarea').closest('label').classList.add('hidden');$('#checkout h3').textContent='Телефон запросит бот в чате';}}
function encodeMaxOrder(){const mode=draft.delivery==='delivery'?'d':'p';const parts=[...cart].sort((a,b)=>a[0]-b[0]).map(([id,q])=>{if(!product(id)||!Number.isInteger(q)||q<1||q>100000)throw new Error('Проверьте количество упаковок.');return id.toString(36)+'.'+q.toString(36);});const payload='o1'+mode+'_'+parts.join('-');if(payload.length>128)throw new Error('Слишком много позиций. Разделите заказ.');return payload;}
function submitMaxOrder(){try{const payload=encodeMaxOrder();mx.openMaxLink('https://max.ru/se15000714_bot?start='+payload);toast('Продолжите оформление в чате бота. Телефон запросит бот.');}catch(e){$('#order-error').textContent=e.message||'Не удалось открыть чат бота.';$('#order-error').classList.remove('hidden');}}
function submitOrder(){if(submitted||!cart.size||view!=='cart')return;if(insideMax){submitMaxOrder();return;}const form=$('#checkout');const name=$('#name'),phone=$('#phone');name.setCustomValidity(name.value.trim()?'':'Введите имя');const digits=phone.value.replace(/\D/g,'');phone.setCustomValidity(/^[+\d\s()\-]+$/.test(phone.value)&&digits.length>=10&&digits.length<=15?'':'Введите номер: от 10 до 15 цифр');if(!form.reportValidity())return;
const order={store:'Плитка Плюс',currency:'RUB',items:[...cart].map(([id,q])=>{const p=product(id);return {id,name:p.name,format:p.format,surface:p.surface,price_m2:p.price,m2_per_pack:p.pack/100,packs:q,m2:p.pack*q/100,total:packPrice(p)*q/100};}),total:total()/100,customer:{name:name.value.trim(),phone:phone.value.trim()},delivery:draft.delivery,comment:draft.comment.trim(),delivery_cost:null};
const json=JSON.stringify(order);if(insideTelegram){try{if(new TextEncoder().encode(json).length>4096)throw new Error('Заказ превышает лимит Telegram. Сократите комментарий или число позиций.');submitted=true;$('#submit').disabled=true;tg.MainButton?.disable();tg.sendData(json);showResult(order,true);}catch(e){submitted=false;$('#submit').disabled=false;tg.MainButton?.enable();$('#order-error').textContent=e.message||'Не удалось передать заказ в Telegram.';$('#order-error').classList.remove('hidden');}}else showResult(order,false);}
function showResult(order,sent){view='result';$('#main').innerHTML=`<div class="box"><div class="success-mark" aria-hidden="true">✓</div><h2>${sent?'Вызов Telegram выполнен':'Заказ сформирован'}</h2><p class="muted" style="margin-top:10px">${sent?'Вызван sendData. Получение заказа ботом здесь не подтверждается.':'Итог показан только на этом устройстве. Заказ никуда не отправлен.'}</p><div id="summary" class="summary"></div><details><summary>JSON заказа</summary><pre id="json" class="json"></pre></details></div><button id="return-cart" class="primary" style="margin-top:20px">Вернуться в корзину</button>`;$('#summary').textContent=order.items.map(i=>i.name+' · '+i.packs+' уп. · '+money(i.total)).join('\n')+'\n\nИтого: '+money(order.total)+'\n'+(order.delivery==='delivery'?'Доставка (стоимость отдельно)':'Самовывоз')+'\nИмя: '+order.customer.name+'\nТелефон: '+order.customer.phone+(order.comment?'\nКомментарий: '+order.comment:'');$('#json').textContent=JSON.stringify(order,null,2);$('#return-cart').onclick=()=>go('cart');updateNav();window.scrollTo(0,0);}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2200);}
function theme(){const t=tg?.themeParams||{};const vars={'--bg':t.bg_color||'#f6f5f0','--panel':t.section_bg_color||t.bg_color||'#fff','--text':t.text_color||'#253c36','--muted':t.hint_color||'#69756e','--accent':t.button_color||'#315b49','--onaccent':t.button_text_color||'#fff','--soft':t.secondary_bg_color||'#eaece3','--line':t.section_separator_color||(tg?.colorScheme==='dark'?'#454b49':'#dce0d7'),'--danger':t.destructive_text_color||(tg?.colorScheme==='dark'?'#ff9a8d':'#a54438')};Object.entries(vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));document.documentElement.style.colorScheme=tg?.colorScheme==='dark'?'dark':'light';}
document.addEventListener('DOMContentLoaded',()=>{mx=window.WebApp;insideMax=!!mx&&!!mx.initData&&typeof mx.openMaxLink==='function';tg=window.Telegram?.WebApp;insideTelegram=!insideMax&&!!tg&&(!!tg.initData||!!tg.platform&&tg.platform!=='unknown');theme();if(insideTelegram){tg.ready();tg.expand();tg.onEvent('themeChanged',theme);tg.MainButton?.onClick(submitOrder);}$('#nav-catalog').onclick=()=>go('catalog');$('#nav-cart').onclick=()=>go('cart');render();});
</script></body></html>
